{% include "header.html" %}

<div id="auction-root-cont">
    <h1>{{item.name}}</h1>
        <div class="card ">
            <img class="card-img-top" style="
                width: 200px;
                height: 15vw;
                object-fit: cover;" src="static/images/250px-Nintendo-Game-Boy-Advance-Purple-FL.jpeg" alt="Card image cap">
            <div class="card-body">
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="card-text">{{ item.description }}</p>
            <p class="card-text">{{ item.price }}</p>
            <p class="card-text">{{ item.categories }}</p>
            {% if item.auction_id %}
            <a href="{{ url_for('view_auction', auction_id=item.auction_id) }}" class="btn btn-primary">go to auction</a>
            {% else %}
            <a href="{{ url_for('create_auction', item_id=item.item_id) }}" class="btn btn-primary">create auction</a>
            {% endif %}
            </div>
        </div>
</div>

{% include "footer.html" %}
