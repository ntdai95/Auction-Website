{% include "header.html" %}

<h1 class="page-title">Complete order</h1>
<p class="page-subtitle">Check the items, then pick a payment method.</p>

<div class="panel">
    <div class="table-wrap">
        <table>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
            {% for item in cart_ls %}
            <tr>
                <td>{{ item.name }}</td>
                <td>${{ item.price }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

    <div class="price-row">
        <div class="price-block">
            <span class="label">Total</span>
            <span class="value bid">${{ total }}</span>
        </div>
    </div>
</div>

<div class="panel" id="payment-cont">
    <h4>Pay by</h4>
    <div class="field">
        <label for="payment">Card</label>
        <select id="payment" name="payment">
            <option value="debit">Debit card ending 1234</option>
        </select>
    </div>
    <a id="complete-button" href="{{ url_for('order_complete', user_id=None) }}" class="btn btn-primary">Place order</a>
</div>

<script src="{{ url_for('static', filename='js/order.js') }}"></script>

{% include "footer.html" %}
