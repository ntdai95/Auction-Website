{% include "header.html" %}

<h1 class="page-title">New auction</h1>
<p class="page-subtitle">Opening an auction on {{ item.name }}.</p>

<div class="panel" style="max-width: 520px;">
    <form action="/create-auction" method="POST">
        <div class="field">
            <label for="auction-type">Auction type</label>
            <select id="auction-type" name="auction_type">
                <option value="first_bid">First bid auction</option>
                <option value="second_bid">Second bid auction</option>
                <option value="buy_now">Buy now</option>
            </select>
        </div>

        <div class="field">
            <label for="start">Start date</label>
            <input type="date" id="start" name="start_date" required>
        </div>
        <div class="field">
            <label for="start-time">Start time</label>
            <input type="time" id="start-time" name="start_time" required>
        </div>
        <div class="field">
            <label for="end">End date</label>
            <input type="date" id="end" name="end_date" required>
        </div>
        <div class="field">
            <label for="end-time">End time</label>
            <input type="time" id="end-time" name="end_time" required>
        </div>

        <input type="hidden" name="item_id" value="{{ item.item_id }}">
        <input type="hidden" id="input-user-id" name="user_id">
        <button class="btn btn-primary" type="submit">Create auction</button>
    </form>
</div>

<script src="{{ url_for('static', filename='js/create-auction.js') }}"></script>

{% include "footer.html" %}
