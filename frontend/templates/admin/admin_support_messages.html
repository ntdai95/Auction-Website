{% include "header.html" %}

<h1 class="page-title">Support messages</h1>
<p class="page-subtitle">Messages users have sent to support.</p>

{% if message_ls %}
<div class="panel">
    {% for i in message_ls %}
    <p>{{ i["message"] | truncate(1024, True) }}</p>
    {% endfor %}
</div>
{% else %}
<div class="empty-state">
    No support messages.
</div>
{% endif %}
