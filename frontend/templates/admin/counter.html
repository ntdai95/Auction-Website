{% include "admin_header.html" %}

<div id="myitems-root-cont">
    {% for item in item_ls %}
    <div id="item-card-{{item.item_id}}" class="card ">
        <div class="card-body">
            <h5 class="card-title">name:{{ item.name }}</h5>
            <p class="card-text">description:{{ item.description }}</p>
            <div>
                <a href='http://localhost:3307/item/delete?item_id={{item.item_id}}' class="btn btn-primary">Delete</a>
                <a href='http://localhost:3307/item/unflag_counterfeit?item_id={{item.item_id}}' class="btn btn-primary">Not Counterfeit</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% include "admin_footer.html" %}
